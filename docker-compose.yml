services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quewe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quewe}
      POSTGRES_DB: ${POSTGRES_DB:-quewe}
    volumes:
      - quewe_pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quewe -d quewe"]
      interval: 5s
      timeout: 5s
      retries: 20

  quewe:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-dev}
      DEBUG_AUTH_STUB: ${DEBUG_AUTH_STUB:-true}
      DATABASE_URL: ${DATABASE_URL:-postgres://quewe:quewe@db:5432/quewe?sslmode=disable}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quewe_pgdata: